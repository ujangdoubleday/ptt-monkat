# Dev datastores for ptt-monkat. Credentials here are dev-only and match
# apps/backend/.env.example — production values come from the real environment.
services:
  mariadb:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: ptt_monkat
      MARIADB_USER: monkat
      MARIADB_PASSWORD: changeme
    ports:
      # 3307 on the host: 3306 is already taken by a pre-existing MariaDB
      - "3307:3306"
    volumes:
      # runs once on an empty data dir
      - ./db/001_mariadb_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
      - ./db/002_demo_targets.sql:/docker-entrypoint-initdb.d/002_demo.sql:ro
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  influxdb:
    image: influxdb:2.7
    restart: unless-stopped
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: changeme123
      DOCKER_INFLUXDB_INIT_ORG: ptt
      DOCKER_INFLUXDB_INIT_BUCKET: snmp_metrics
      DOCKER_INFLUXDB_INIT_RETENTION: 90d
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: dev-token-ptt-monkat
    ports:
      # 8087 on the host: 8086 is already taken by a pre-existing influxd
      - "8087:8086"
    volumes:
      - influx_data:/var/lib/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # A real SNMP agent to poll during development. Not part of the system —
  # it stands in for the routers/UPS/DWDM gear the poller talks to in prod.
  snmpd:
    image: polinux/snmpd
    restart: unless-stopped
    ports:
      - "1161:161/udp"
    volumes:
      - ./sim/snmpd.conf:/etc/snmp/snmpd.conf:ro
      - ./sim/ptt-sim.sh:/usr/local/bin/ptt-sim.sh:ro
      - ./sim/ptt-sim-persist.sh:/usr/local/bin/ptt-sim-persist.sh:ro
      - ./sim/site-seed.txt:/usr/local/share/ptt-site-seed.txt:ro

volumes:
  mariadb_data:
  influx_data:

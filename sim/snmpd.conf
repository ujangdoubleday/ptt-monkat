# Dev-only SNMP agent config. Serves fake network gear so the poller has
# something that moves. Nothing real lives under enterprise 99999 — it is a
# deliberately invalid enterprise number.
rocommunity public
agentAddress udp:161

# .99999.1..4  — the four demo devices (router, DWDM, UPS). One fork per GET
# is fine at this size. See sim/ptt-sim.sh.
pass .1.3.6.1.4.1.99999.1 /usr/local/bin/ptt-sim.sh
pass .1.3.6.1.4.1.99999.2 /usr/local/bin/ptt-sim.sh
pass .1.3.6.1.4.1.99999.3 /usr/local/bin/ptt-sim.sh
pass .1.3.6.1.4.1.99999.4 /usr/local/bin/ptt-sim.sh

# .99999.10.*  — 87 site power plants, ~340 OIDs. Persistent process: forking
# per GET at this volume would not keep up with a 10s poll.
pass_persist .1.3.6.1.4.1.99999.10 /usr/local/bin/ptt-sim-persist.sh

# Dev-only SNMP agent config. Serves a small arc of fake network gear so the
# poller has something that moves — see sim/ptt-sim.sh for the values.
rocommunity public
agentAddress udp:161

# Everything under this enterprise arc is answered by the simulator script.
# 99999 is a deliberately invalid enterprise number: nothing real lives here.
pass .1.3.6.1.4.1.99999 /usr/local/bin/ptt-sim.sh
